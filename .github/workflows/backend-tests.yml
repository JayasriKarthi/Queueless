# Runs every backend test suite on every push and pull request.
# MongoDB comes from mongodb-memory-server (started by the tests themselves, as a replica set);
# Redis runs as a service container, like the local ql-redis.
name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The MongoDB binary used by mongodb-memory-server (about 100 MB), downloaded once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - run: npm ci
      - run: npm test
